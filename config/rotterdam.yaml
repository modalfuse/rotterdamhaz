    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
    - "[operator]"
  redact_url_domains: [[operator page], [operator page], [operator].com, [operator page], [operator page], [operator page], [operator page], [operator page],
                       [operator page], [operator page], [operator page], [operator page], [operator page], [operator page], [operator].com, [operator page],
                       [operator page], [operator page], [operator page], [operator page], [operator page]
  private_dir: "{work}/private"
